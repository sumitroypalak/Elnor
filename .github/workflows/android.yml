name: Build Elnor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (uses the version in gradle/wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test.log

      - name: Show test failures and compile errors
        if: failure()
        run: |
          grep -E '^e: ' test.log | head -30 | sed -E 's/^/::error title=Kotlin compile error::/' || true
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      for e in tc.findall(kind):
                          msg = (e.get('message') or '')[:300].replace('\n', ' ').replace('%', ' ')
                          print('::error title=Test failed ' + tc.get('classname', '') + '.' + tc.get('name', '') + '::' + msg)
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Elnor-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Elnor-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
